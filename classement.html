<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🏸 Classement</title>
<!--
  Page statique et 100% autonome : elle ne contacte AUCUN serveur et ne lit
  AUCUNE base de données. Le classement entier est encodé dans le paramètre
  "d" de l'URL (voir index.html, fonction buildClassementUrl) — cette page se
  contente de le décoder et de l'afficher. Elle doit vivre dans le MÊME dossier
  que index.html (même hébergement) pour que le lien généré par le QR code
  fonctionne : le QR ne fait que pointer vers ce fichier avec les données
  dans le lien lui-même, rien n'est stocké ni interrogé côté serveur.
-->
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0f1e;--card:#111827;--border:#1f2d40;--accent:#f59e0b;--text:#f1f5f9;--muted:#64748b;
    --green:#10b981;--female:#ec4899;--male:#3b82f6;
    --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html{height:-webkit-fill-available}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
    background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;
    min-height:100vh;min-height:-webkit-fill-available;
    padding:calc(20px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
    -webkit-font-smoothing:antialiased;
  }
  header{text-align:center;margin-bottom:18px}
  header .logo{font-size:38px;display:block;margin-bottom:6px}
  h1{font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-.3px}
  .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .list{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .rank-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:13px 14px;display:flex;align-items:center;gap:12px}
  .rank-card.top3{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.04)}
  .pos{width:30px;text-align:center;font-size:13px;color:var(--muted);flex-shrink:0}
  .pos.medal{font-size:20px}
  .avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;flex-shrink:0;font-size:15px}
  .name{flex:1;font-weight:700;font-size:15px;word-break:break-word}
  .pts{font-size:19px;font-weight:800;color:var(--accent);white-space:nowrap}
  .empty,.error{text-align:center;color:var(--muted);padding:48px 16px;font-size:14px}
  .error{color:#ef4444}
  footer{text-align:center;color:var(--muted);font-size:11px;margin-top:24px}
</style>
</head>
<body>
  <header>
    <span class="logo">🏸</span>
    <h1 id="title">Classement</h1>
    <div class="sub" id="subtitle"></div>
  </header>
  <div class="list" id="list"></div>
  <footer id="footer" style="display:none">Généré par BadmintonRank — hors connexion</footer>

<script>
// Décodage du classement encodé dans l'URL : ?d=<base64 url-safe d'un JSON compact>
// { g: nom du groupe ou null, t: date ISO, p: [[nom, points], ...] déjà triés }
// Aucun réseau, aucune base de données : tout est dans le lien lui-même.
function b64urlToStr(b64url) {
  let b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  return decodeURIComponent(escape(atob(b64)));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const params = new URLSearchParams(location.search);
  const raw = params.get('d');
  const listEl = document.getElementById('list');
  const footerEl = document.getElementById('footer');

  if (!raw) {
    document.getElementById('subtitle').textContent = '';
    listEl.innerHTML = '<div class="empty">Aucun classement dans ce lien.</div>';
    return;
  }

  let data;
  try {
    data = JSON.parse(b64urlToStr(raw));
  } catch (e) {
    listEl.innerHTML = '<div class="error">Lien invalide ou corrompu.</div>';
    return;
  }

  const title = data.g ? `Classement — ${data.g}` : 'Classement';
  document.title = '🏸 ' + title;
  document.getElementById('title').textContent = title;
  const d = data.t ? new Date(data.t) : null;
  document.getElementById('subtitle').textContent = d && !isNaN(d)
    ? 'Généré le ' + d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
    : '';

  const players = Array.isArray(data.p) ? data.p : [];
  if (players.length === 0) {
    listEl.innerHTML = '<div class="empty">Aucun joueur dans ce classement.</div>';
    return;
  }

  const medals = ['🥇', '🥈', '🥉'];
  listEl.innerHTML = players.map((entry, i) => {
    const name = String(entry[0] ?? '');
    const pts = entry[1] ?? '';
    const initial = name ? name[0].toUpperCase() : '?';
    // Couleur d'avatar dérivée du nom (pas de données de genre transmises, pour rester compact) :
    const hue = Array.from(name).reduce((h, c) => h + c.charCodeAt(0), 0) % 2 === 0 ? 'var(--male)' : 'var(--female)';
    return `<div class="rank-card ${i < 3 ? 'top3' : ''}">
      <div class="pos ${i < 3 ? 'medal' : ''}">${medals[i] || '#' + (i + 1)}</div>
      <div class="avatar" style="background:${hue}">${escapeHtml(initial)}</div>
      <div class="name">${escapeHtml(name)}</div>
      <div class="pts">${escapeHtml(String(pts))}</div>
    </div>`;
  }).join('');
  footerEl.style.display = 'block';
}

render();
</script>
</body>
</html>
